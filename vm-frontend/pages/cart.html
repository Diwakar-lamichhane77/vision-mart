<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your bag — Vision Mart</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/cart.css">
  <link rel="stylesheet" href="../css/footer.css">
</head>

<body>
  <a class="vm-skip" href="#cartLines">Skip to your bag</a>
  <div id="vmNavbar"></div>

  <main class="vm-shell">
    <header class="vm-bag-head">
      <nav class="vm-breadcrumb"><a href="../index.html">Home</a> / <span>Bag</span></nav>
      <h1>Your bag</h1>
      <p id="bagSubtitle">Loading...</p>
    </header>

    <div class="vm-bag" id="bagGrid">
      <section>
        <div class="vm-bag-toolbar" id="bagToolbar" hidden>
          <a class="vm-link" href="shop.html"><i class="bi bi-arrow-left"></i> Continue shopping</a>
          <button class="vm-line__remove" type="button" id="clearBag">Empty bag</button>
        </div>

        <!-- Lines rendered by cart.js from GET /cart -->
        <div class="vm-lines" id="cartLines"></div>
      </section>

      <aside class="vm-summary" id="summaryCard">
        <h2>Order summary</h2>
        <div id="summaryBody"></div>
        <div class="vm-summary__actions">
          <button class="vm-btn vm-btn--coat vm-btn--block" id="checkoutBtn">
            Proceed to checkout
          </button>
          <a class="vm-btn vm-btn--outline vm-btn--block" href="wishlist.html">View wishlist</a>
        </div>
      </aside>
    </div>
  </main>

  <div id="vmFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
