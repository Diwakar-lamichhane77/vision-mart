<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your wishlist — Vision Mart</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/cart.css">
  <link rel="stylesheet" href="../css/footer.css">
</head>

<body>
  <a class="vm-skip" href="#wishGrid">Skip to saved items</a>
  <div id="vmNavbar"></div>

  <main class="vm-shell">
    <header class="vm-bag-head">
      <nav class="vm-breadcrumb"><a href="../index.html">Home</a> / <span>Wishlist</span></nav>
      <h1>Your wishlist</h1>
      <p id="wishSubtitle">Loading...</p>
    </header>

    <div class="vm-bag-toolbar" id="wishToolbar" hidden>
      <a class="vm-link" href="shop.html"><i class="bi bi-arrow-left"></i> Continue shopping</a>
      <div class="d-flex gap-2 flex-wrap">
        <button class="vm-btn vm-btn--outline vm-btn--sm" id="moveAllBtn">
          Move all available to bag
        </button>
        <button class="vm-line__remove" type="button" id="clearWish">Clear wishlist</button>
      </div>
    </div>

    <!-- Cards rendered by wishlist.js from GET /wishlist -->
    <div class="vm-wish-grid" id="wishGrid" style="padding-bottom:clamp(3rem,6vw,5rem)"></div>
  </main>

  <div id="vmFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/wishlist.js"></script>
</body>
</html>
