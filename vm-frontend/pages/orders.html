<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your orders — Vision Mart</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/checkout.css">
  <link rel="stylesheet" href="../css/footer.css">
</head>

<body>
  <div id="vmNavbar" class="vm-no-print"></div>

  <main class="vm-shell vm-no-print">
    <header class="vm-co-head">
      <nav class="vm-breadcrumb"><a href="../index.html">Home</a> / <span>Orders</span></nav>
      <h1>Your orders</h1>
      <p id="ordersSubtitle">Loading...</p>
    </header>

    <div class="vm-tabs" id="orderTabs" hidden></div>

    <!-- Cards rendered by orders.js from GET /orders -->
    <div id="orderList" style="padding-bottom:clamp(3rem,6vw,5rem)"></div>
  </main>

  <!-- Order detail: timeline + printable invoice -->
  <div class="vm-modal" id="orderModal" role="dialog" aria-modal="true" aria-label="Order details">
    <div class="vm-modal__panel">
      <button class="vm-modal__close vm-no-print" type="button" aria-label="Close">
        <i class="bi bi-x-lg"></i>
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="vmFooter" class="vm-no-print"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/orders.js"></script>
</body>
</html>
