<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers — Vision Mart Admin</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="vm-admin">

  <div id="vmSidebar"></div>

  <div class="vm-main">
    <header class="vm-topbar">
      <button class="vm-side-toggle" id="sideToggle" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <h1 id="pageTitle">Customers</h1>
      <div class="vm-topbar__actions"></div>
    </header>

    <main class="vm-content">
      <div class="vm-apanel">
        <div class="vm-atoolbar">
          <div class="vm-asearch">
            <i class="bi bi-search"></i>
            <label class="vm-sr" for="uSearch">Search customers</label>
            <input class="vm-input" type="search" id="uSearch" placeholder="Name, email or phone...">
          </div>
          <label class="vm-sr" for="uStatus">Filter by status</label>
          <select class="vm-select vm-select--sm" id="uStatus">
            <option value="">All customers</option>
            <option value="active">Active</option>
            <option value="blocked">Blocked</option>
          </select>
        </div>

        <div class="vm-table-wrap">
          <table class="vm-table" id="uTable">
            <thead><tr>
              <th>Customer</th><th>Phone</th><th class="num">Orders</th>
              <th class="num">Spent</th><th>Status</th><th></th>
            </tr></thead>
          </table>
        </div>
        <div class="vm-apager" id="uPager"></div>
      </div>
    </main>
  </div>

  <div class="vm-amodal" id="userModal" role="dialog" aria-modal="true" aria-labelledby="uModalTitle">
    <div class="vm-amodal__panel">
      <div class="vm-amodal__head">
        <h3 id="uModalTitle">Customer</h3>
        <button class="vm-amodal__close" type="button" id="uModalClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="vm-amodal__body" id="uModalBody"></div>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/admin/core.js"></script>
  <script src="../../js/admin/users.js"></script>
</body>
</html>
