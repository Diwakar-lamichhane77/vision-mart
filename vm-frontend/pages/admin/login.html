<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in — Vision Mart</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
  <main class="vm-alogin">
    <div class="vm-alogin__card">
      <div class="vm-alogin__brand">
        <span class="vm-side__mark">VM</span>
        <h1>Admin sign in</h1>
        <p>Staff access to the Vision Mart back office.</p>
      </div>

      <form id="adminLoginForm" novalidate>
        <div class="vm-alert vm-alert--error" id="loginAlert" role="alert">
          <i class="bi bi-exclamation-circle-fill"></i><span></span>
        </div>

        <div class="vm-field">
          <label class="vm-field__label" for="aEmail">Email</label>
          <input class="vm-input" type="email" id="aEmail" name="email"
                 autocomplete="username" placeholder="admin@visionmart.com" required>
          <div class="vm-field__error"></div>
        </div>

        <div class="vm-field">
          <label class="vm-field__label" for="aPassword">Password</label>
          <input class="vm-input" type="password" id="aPassword" name="password"
                 autocomplete="current-password" required>
          <div class="vm-field__error"></div>
        </div>

        <button class="vm-btn vm-btn--coat vm-btn--block" type="submit" id="aSubmit"
                style="margin-top:.35rem">Sign in</button>
      </form>

      <p class="vm-field__hint" style="text-align:center;margin-top:1.25rem">
        Customer account? <a href="../login.html">Sign in to the shop</a>.
      </p>
    </div>
  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/admin/core.js"></script>
  <script src="../../js/admin/login.js"></script>
</body>
</html>
