<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Vision Mart Admin</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="vm-admin">

  <div id="vmSidebar"></div>

  <div class="vm-main">
    <header class="vm-topbar">
      <button class="vm-side-toggle" id="sideToggle" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="vm-topbar__actions"></div>
    </header>

    <main class="vm-content">
      <!-- Summary cards, filled from GET /admin/dashboard -->
      <div class="vm-cards" id="dashCards"></div>

      <div class="vm-grid-2col">
        <div class="vm-apanel">
          <div class="vm-apanel__head">
            <h2>Monthly sales</h2>
            <span class="vm-tsub ms-auto">Last 12 months</span>
          </div>
          <div class="vm-apanel__body">
            <!-- Bars drawn from real monthly_sales data (see dashboard.js) -->
            <div class="vm-chart" id="salesChart"></div>
            <p class="vm-chart-note" id="chartNote"></p>
          </div>
        </div>

        <div class="vm-apanel">
          <div class="vm-apanel__head"><h2>Order pipeline</h2></div>
          <div class="vm-apanel__body" id="pipeline"></div>
        </div>
      </div>

      <div class="vm-grid-2col">
        <div class="vm-apanel">
          <div class="vm-apanel__head">
            <h2>Recent orders</h2>
            <a class="vm-link ms-auto" href="orders.html">All orders</a>
          </div>
          <div class="vm-table-wrap">
            <table class="vm-table">
              <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th class="num">Total</th></tr></thead>
              <tbody id="recentBody"></tbody>
            </table>
          </div>
        </div>

        <div class="vm-apanel">
          <div class="vm-apanel__head">
            <h2>Low stock</h2>
            <span class="vm-tsub ms-auto" id="lowStockNote"></span>
          </div>
          <div class="vm-table-wrap">
            <table class="vm-table">
              <thead><tr><th>Product</th><th class="num">Stock</th><th class="num">Price</th></tr></thead>
              <tbody id="lowStockBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>



  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/admin/core.js"></script>
  <script src="../../js/admin/dashboard.js"></script>
</body>
</html>
