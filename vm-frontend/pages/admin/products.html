<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products — Vision Mart Admin</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="vm-admin">

  <div id="vmSidebar"></div>

  <div class="vm-main">
    <header class="vm-topbar">
      <button class="vm-side-toggle" id="sideToggle" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <h1 id="pageTitle">Products</h1>
      <div class="vm-topbar__actions"><button class="vm-btn vm-btn--coat vm-btn--sm" id="newProduct"><i class="bi bi-plus-lg"></i> New product</button></div>
    </header>

    <main class="vm-content">
      <div class="vm-apanel">
        <div class="vm-atoolbar">
          <div class="vm-asearch">
            <i class="bi bi-search"></i>
            <label class="vm-sr" for="pSearch">Search products</label>
            <input class="vm-input" type="search" id="pSearch" placeholder="Search name, brand, colour...">
          </div>
          <label class="vm-sr" for="pFilterCat">Filter by category</label>
          <select class="vm-select vm-select--sm" id="pFilterCat"></select>
          <label class="vm-sr" for="pSort">Sort</label>
          <select class="vm-select vm-select--sm" id="pSort">
            <option value="newest">Newest</option>
            <option value="name_asc">Name A–Z</option>
            <option value="price_low">Price low to high</option>
            <option value="price_high">Price high to low</option>
            <option value="popularity">Best selling</option>
          </select>
        </div>

        <div class="vm-table-wrap">
          <table class="vm-table" id="pTable">
            <thead><tr>
              <th>Product</th><th>Category</th><th class="num">Price</th>
              <th class="num">Stock</th><th>Status</th><th></th>
            </tr></thead>
          </table>
        </div>
        <div class="vm-apager" id="pPager"></div>
      </div>
    </main>
  </div>

  <div class="vm-amodal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="pModalTitle">
    <div class="vm-amodal__panel">
      <div class="vm-amodal__head">
        <h3 id="pModalTitle">New product</h3>
        <button class="vm-amodal__close" type="button" id="pModalClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
      <form id="productForm" novalidate>
        <div class="vm-amodal__body">
          <div class="vm-field">
            <label class="vm-field__label" for="pImage">Image</label>
            <div class="vm-imgpick">
              <div class="vm-imgpick__preview" id="pPreview"><i class="bi bi-image"></i></div>
              <div style="flex:1">
                <input class="vm-input" type="file" id="pImage" name="image" accept="image/*">
                <p class="vm-field__hint" id="pImageHint"></p>
              </div>
            </div>
          </div>

          <div class="vm-field">
            <label class="vm-field__label" for="pName">Name</label>
            <input class="vm-input" type="text" id="pName" name="name" required>
            <div class="vm-field__error"></div>
          </div>

          <div class="vm-grid-2col" style="grid-template-columns:1fr 1fr;gap:0 1rem">
            <div class="vm-field">
              <label class="vm-field__label" for="pBrand">Brand</label>
              <input class="vm-input" type="text" id="pBrand" name="brand">
              <div class="vm-field__error"></div>
            </div>
            <div class="vm-field">
              <label class="vm-field__label" for="pCategory">Category</label>
              <select class="vm-select" id="pCategory" name="category_id" required></select>
              <div class="vm-field__error"></div>
            </div>
            <div class="vm-field">
              <label class="vm-field__label" for="pPrice">Price</label>
              <input class="vm-input" type="number" id="pPrice" name="price" min="0" step="0.01" required>
              <div class="vm-field__error"></div>
            </div>
            <div class="vm-field">
              <label class="vm-field__label" for="pDiscount">Discount price</label>
              <input class="vm-input" type="number" id="pDiscount" name="discount_price" min="0" step="0.01">
              <div class="vm-field__error"></div>
            </div>
            <div class="vm-field">
              <label class="vm-field__label" for="pStock">Stock</label>
              <input class="vm-input" type="number" id="pStock" name="stock" min="0" value="0">
              <div class="vm-field__error"></div>
            </div>
            <div class="vm-field">
              <label class="vm-field__label" for="pSku">SKU</label>
              <input class="vm-input" type="text" id="pSku" name="sku">
              <div class="vm-field__error"></div>
            </div>
            <div class="vm-field">
              <label class="vm-field__label" for="pFrameType">Frame type</label>
              <input class="vm-input" type="text" id="pFrameType" name="frame_type" placeholder="Full Rim">
              <div class="vm-field__error"></div>
            </div>
            <div class="vm-field">
              <label class="vm-field__label" for="pFrameMaterial">Frame material</label>
              <input class="vm-input" type="text" id="pFrameMaterial" name="frame_material" placeholder="Acetate">
              <div class="vm-field__error"></div>
            </div>
            <div class="vm-field">
              <label class="vm-field__label" for="pLensType">Lens type</label>
              <input class="vm-input" type="text" id="pLensType" name="lens_type" placeholder="Polarized">
              <div class="vm-field__error"></div>
            </div>
            <div class="vm-field">
              <label class="vm-field__label" for="pColor">Colour</label>
              <input class="vm-input" type="text" id="pColor" name="color">
              <div class="vm-field__error"></div>
            </div>
          </div>

          <div class="vm-field">
            <label class="vm-field__label" for="pStatus">Status</label>
            <select class="vm-select" id="pStatus" name="status">
              <option value="active">Active — visible in the shop</option>
              <option value="inactive">Inactive — hidden from the shop</option>
            </select>
          </div>

          <div class="vm-field">
            <label class="vm-field__label" for="pDescription">Description</label>
            <textarea class="vm-textarea" id="pDescription" name="description" rows="3"></textarea>
            <div class="vm-field__error"></div>
          </div>
        </div>
        <div class="vm-amodal__foot">
          <button class="vm-btn vm-btn--outline" type="button" id="pCancel">Cancel</button>
          <button class="vm-btn vm-btn--coat" type="submit" id="pSave">Save product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/admin/core.js"></script>
  <script src="../../js/admin/products.js"></script>
</body>
</html>
