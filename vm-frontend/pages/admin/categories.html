<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories — Vision Mart Admin</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="vm-admin">

  <div id="vmSidebar"></div>

  <div class="vm-main">
    <header class="vm-topbar">
      <button class="vm-side-toggle" id="sideToggle" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <h1 id="pageTitle">Categories</h1>
      <div class="vm-topbar__actions"><button class="vm-btn vm-btn--coat vm-btn--sm" id="newCategory"><i class="bi bi-plus-lg"></i> New category</button></div>
    </header>

    <main class="vm-content">
      <div class="vm-apanel">
        <div class="vm-atoolbar">
          <div class="vm-asearch">
            <i class="bi bi-search"></i>
            <label class="vm-sr" for="cSearch">Search categories</label>
            <input class="vm-input" type="search" id="cSearch" placeholder="Search categories...">
          </div>
          <span class="vm-tsub" id="cCount"></span>
        </div>

        <div class="vm-table-wrap">
          <table class="vm-table" id="cTable">
            <thead><tr>
              <th>Category</th><th>Description</th><th class="num">Products</th><th>Status</th><th></th>
            </tr></thead>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="vm-amodal" id="categoryModal" role="dialog" aria-modal="true" aria-labelledby="cModalTitle">
    <div class="vm-amodal__panel" style="max-width:520px">
      <div class="vm-amodal__head">
        <h3 id="cModalTitle">New category</h3>
        <button class="vm-amodal__close" type="button" id="cModalClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
      <form id="categoryForm" novalidate>
        <div class="vm-amodal__body">
          <div class="vm-field">
            <label class="vm-field__label" for="cImage">Image</label>
            <div class="vm-imgpick">
              <div class="vm-imgpick__preview" id="cPreview"><i class="bi bi-image"></i></div>
              <div style="flex:1">
                <input class="vm-input" type="file" id="cImage" name="image" accept="image/*">
                <p class="vm-field__hint" id="cImageHint"></p>
              </div>
            </div>
          </div>
          <div class="vm-field">
            <label class="vm-field__label" for="cName">Name</label>
            <input class="vm-input" type="text" id="cName" name="name" required>
            <div class="vm-field__error"></div>
          </div>
          <div class="vm-field">
            <label class="vm-field__label" for="cDescription">Description</label>
            <textarea class="vm-textarea" id="cDescription" name="description" rows="3"></textarea>
            <div class="vm-field__error"></div>
          </div>
          <div class="vm-field">
            <label class="vm-field__label" for="cStatus">Status</label>
            <select class="vm-select" id="cStatus" name="status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="vm-amodal__foot">
          <button class="vm-btn vm-btn--outline" type="button" id="cCancel">Cancel</button>
          <button class="vm-btn vm-btn--coat" type="submit" id="cSave">Save category</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/admin/core.js"></script>
  <script src="../../js/admin/categories.js"></script>
</body>
</html>
