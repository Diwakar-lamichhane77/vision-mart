<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop eyewear — Vision Mart</title>
  <meta name="description" content="Browse prescription frames, sunglasses, reading glasses and contact lenses. Filter by brand, colour, frame type and price.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/shop.css">
  <link rel="stylesheet" href="../css/footer.css">
</head>

<body>
  <a class="vm-skip" href="#results">Skip to results</a>
  <div id="vmNavbar"></div>

  <header class="vm-shop-head">
    <div class="vm-shell">
      <nav class="vm-breadcrumb"><a href="../index.html">Home</a> / <span>Shop</span></nav>
      <h1>All eyewear</h1>
      <p>Frames, sunglasses and lenses — every pair fitted before it ships.</p>
    </div>
  </header>

  <main class="vm-shell">
    <div class="vm-shop">

      <!-- ------------------------- Filter rail ------------------------- -->
      <div class="vm-filters__scrim" id="filterScrim"></div>

      <aside class="vm-filters" id="filterRail" aria-label="Product filters">
        <div class="vm-filters__head">
          <strong>Filters</strong>
          <button class="vm-icon-btn" id="filterClose" aria-label="Close filters">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <!-- Groups are built by shop.js from GET /products/filters -->
        <div id="filterGroups"></div>
      </aside>

      <!-- --------------------------- Results --------------------------- -->
      <section>
        <div id="resultsTop"></div>

        <div class="vm-toolbar">
          <button class="vm-btn vm-btn--outline vm-btn--sm vm-filter-toggle" id="filterToggle">
            <i class="bi bi-sliders"></i> Filters
          </button>

          <div class="vm-search">
            <i class="bi bi-search"></i>
            <label class="vm-sr" for="searchInput">Search products</label>
            <input type="search" id="searchInput" placeholder="Search frames, brands, colours...">
            <button class="vm-search__clear" id="searchClear" type="button" aria-label="Clear search">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>

          <label class="vm-sr" for="sortSelect">Sort products</label>
          <select class="vm-select" id="sortSelect"></select>

          <span class="vm-count" id="resultCount"></span>
        </div>

        <div class="vm-chips" id="activeChips"></div>

        <div class="vm-results" id="results"></div>

        <nav class="vm-pager" id="pager" aria-label="Pagination"></nav>
      </section>
    </div>
  </main>

  <!-- ---------------------------- Quick view --------------------------- -->
  <div class="vm-qv" id="quickView" role="dialog" aria-modal="true" aria-label="Product quick view">
    <div class="vm-qv__panel">
      <button class="vm-qv__close" type="button" aria-label="Close quick view">
        <i class="bi bi-x-lg"></i>
      </button>
      <div class="vm-qv__body" id="quickViewBody"></div>
    </div>
  </div>

  <div id="vmFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/shop.js"></script>
</body>
</html>
