<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — Vision Mart</title>
  <meta name="description" content="Product details, specifications and customer reviews at Vision Mart.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/product.css">
  <link rel="stylesheet" href="../css/footer.css">
</head>

<body>
  <a class="vm-skip" href="#pdp">Skip to product</a>
  <div id="vmNavbar"></div>

  <main class="vm-shell">
    <nav class="vm-breadcrumb" id="crumb" style="padding-top:calc(var(--vm-nav-h) + 1.25rem)">
      <a href="../index.html">Home</a> / <a href="shop.html">Shop</a>
    </nav>

    <!-- Filled by product.js from GET /products/:id -->
    <div class="vm-pdp" id="pdp"></div>

    <!-- Shown only when the product can't be loaded -->
    <div id="pdpEmpty" hidden></div>
  </main>

  <!-- ------------------------- Specifications ------------------------- -->
  <section class="vm-section--tight" id="specsSection">
    <div class="vm-shell">
      <span class="vm-eyebrow">Details</span>
      <h2 class="vm-title--sm mb-3">Specifications</h2>
      <dl class="vm-specs" id="specs"></dl>
    </div>
  </section>

  <!-- ----------------------------- Reviews ---------------------------- -->
  <section class="vm-section vm-section--mist" id="reviewsSection">
    <div class="vm-shell">
      <span class="vm-eyebrow">Customer feedback</span>
      <h2 class="vm-title--sm mb-4">Ratings &amp; reviews</h2>

      <div class="vm-reviews">
        <div class="vm-rsummary" id="reviewSummary"></div>
        <div id="reviewList"></div>
      </div>
    </div>
  </section>

  <!-- ------------------------ Related products ------------------------ -->
  <section class="vm-section" id="relatedSection">
    <div class="vm-shell">
      <div class="vm-section-head">
        <div>
          <span class="vm-eyebrow">You may also like</span>
          <h2 class="vm-title--sm mb-0">Related frames</h2>
        </div>
        <a class="vm-link" href="shop.html">All eyewear <i class="bi bi-arrow-right"></i></a>
      </div>
      <div class="vm-product-grid" id="relatedGrid"></div>
    </div>
  </section>

  <div id="vmFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/product.js"></script>
</body>
</html>
