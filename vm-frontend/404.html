<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Vision Mart</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">

  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/footer.css">

  <style>
    .vm-404 { min-height: 72svh; display: grid; place-items: center; text-align: center;
              padding: calc(var(--vm-nav-h) + 3rem) var(--vm-gutter) 4rem; }
    /* The lens motif again: the number sharpens into focus on load. */
    .vm-404__code { font-family: var(--vm-display); font-size: clamp(5rem, 18vw, 11rem);
                    line-height: .9; letter-spacing: -.04em; margin-bottom: .5rem;
                    filter: blur(12px); opacity: 0; animation: vm-focus-in 1s cubic-bezier(.16,1,.3,1) .1s forwards; }
    .vm-404__code em { font-style: italic; color: var(--vm-brass); }
    .vm-404 p { max-width: 44ch; margin-inline: auto; color: var(--vm-graphite); }
    .vm-404__links { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; margin-top: 1.75rem; }
    @media (prefers-reduced-motion: reduce) { .vm-404__code { filter: none; opacity: 1; animation: none; } }
  </style>
</head>
<body>
  <div id="vmNavbar"></div>

  <main class="vm-404">
    <div>
      <h1 class="vm-404__code">4<em>0</em>4</h1>
      <h2 class="vm-title--sm" style="margin-bottom:.6rem">This page isn't in focus</h2>
      <p>
        The page you're after has moved or never existed. The frames are all
        still here though — try the shop.
      </p>
      <div class="vm-404__links">
        <a class="vm-btn vm-btn--coat" href="pages/shop.html">Shop eyewear</a>
        <a class="vm-btn vm-btn--outline" href="index.html">Back home</a>
        <a class="vm-btn vm-btn--ghost" href="pages/contact.html">Contact us</a>
      </div>
    </div>
  </main>

  <div id="vmFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script>document.addEventListener("DOMContentLoaded", () => initLayout());</script>
</body>
</html>
